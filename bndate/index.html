<body class="bg-background text-on-surface font-body-md selection:bg-primary-fixed selection:text-on-primary-fixed">

<main class="max-w-container-max mx-auto px-gutter py-stack-lg min-h-screen">
  <!-- Breadcrumbs & Tool Header -->
  <div class="mb-stack-lg">
    <nav class="flex items-center text-body-sm text-text-secondary mb-base">
      <a class="hover:text-primary no-underline" href="../">Tools</a>
      <span class="material-symbols-outlined text-[14px] mx-base">chevron_right</span>
      <span class="text-on-surface">Bangla Date Converter</span>
    </nav>
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-stack-md border-b border-border-subtle pb-stack-md">
      <div>
        <h1 class="font-headline-md text-headline-md font-bold">Bangla ↔ Gregorian Date Converter</h1>
        <p class="text-text-secondary mt-base font-body-md">Convert dates between the Bengali (Bangabda) calendar and the standard Gregorian calendar in real-time.</p>
      </div>
    </div>
  </div>

  <!-- Main Converter Layout -->
  <div class="max-w-3xl mx-auto bg-surface-container-lowest border border-border-subtle p-6 md:p-8 rounded shadow-sm">
    <div class="grid grid-cols-1 md:grid-cols-[1fr_auto_1fr] gap-6 items-center">
      
      <!-- Bangla Date Column -->
      <div class="w-full">
        <div class="flex items-center gap-base border-b border-border-subtle pb-base mb-stack-md justify-center">
          <span class="material-symbols-outlined text-chrono-event">calendar_month</span>
          <h2 class="text-headline-sm font-bold text-on-surface">Bangla (বঙ্গাব্দ)</h2>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div class="flex flex-col gap-1">
            <label for="bangla-day" class="text-body-sm text-text-secondary font-semibold">দিন / Day</label>
            <select id="bangla-day" class="py-2 px-3 border border-border-subtle bg-white rounded shadow-sm focus:ring-1 focus:ring-primary focus:border-primary text-body-md cursor-pointer">
              <!-- Options populated by JS -->
            </select>
          </div>
          <div class="flex flex-col gap-1">
            <label for="bangla-month" class="text-body-sm text-text-secondary font-semibold">মাস / Month</label>
            <select id="bangla-month" class="py-2 px-3 border border-border-subtle bg-white rounded shadow-sm focus:ring-1 focus:ring-primary focus:border-primary text-body-md cursor-pointer">
              <!-- Options populated by JS -->
            </select>
          </div>
          <div class="flex flex-col gap-1">
            <label for="bangla-year" class="text-body-sm text-text-secondary font-semibold">বছর / Year</label>
            <input type="number" id="bangla-year" class="py-2 px-3 border border-border-subtle bg-white rounded shadow-sm focus:ring-1 focus:ring-primary focus:border-primary text-body-md" placeholder="e.g. 1431"/>
          </div>
        </div>
      </div>

      <!-- Sync/Arrow Icon -->
      <div class="text-center my-4 md:my-0 flex justify-center">
        <div class="w-10 h-10 rounded-full bg-surface-subtle border border-border-subtle flex items-center justify-center text-primary shadow-sm">
          <span class="material-symbols-outlined transform md:rotate-0 rotate-90 text-[20px]">sync_alt</span>
        </div>
      </div>

      <!-- Gregorian Date Column -->
      <div class="w-full">
        <div class="flex items-center gap-base border-b border-border-subtle pb-base mb-stack-md justify-center">

<script src="../yt-shell.js"></script>
<script>
  // --- Constants ---
  const BANGLA_MONTHS = ["বৈশাখ", "জ্যৈষ্ঠ", "আষাঢ়", "শ্রাবণ", "ভাদ্র", "আশ্বিন", "কার্তিক", "অগ্রহায়ণ", "পৌষ", "মাঘ", "ফাল্গুন", "চৈত্র"];
  const ENGLISH_MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const BANGLA_YEAR_OFFSET = 593;

  // --- DOM Elements ---
  const banglaDaySelect = document.getElementById('bangla-day');
  const banglaMonthSelect = document.getElementById('bangla-month');
  const banglaYearInput = document.getElementById('bangla-year');
  const englishDaySelect = document.getElementById('english-day');
  const englishMonthSelect = document.getElementById('english-month');
  const englishYearInput = document.getElementById('english-year');

  const isGregorianLeap = (year) => (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);

  function populateSelect(selectElement, start, end, optionsArray) {
    for (let i = start; i <= end; i++) {
      const option = document.createElement('option');
      option.value = i;
      option.textContent = optionsArray ? optionsArray[i - start] : i;
      selectElement.appendChild(option);
    }
  }

  function initialize() {
    populateSelect(banglaDaySelect, 1, 31);
    populateSelect(englishDaySelect, 1, 31);
    populateSelect(banglaMonthSelect, 1, 12, BANGLA_MONTHS);
    populateSelect(englishMonthSelect, 1, 12, ENGLISH_MONTHS);
    
    const today = new Date();
    englishDaySelect.value = today.getDate();
    englishMonthSelect.value = today.getMonth() + 1;
    englishYearInput.value = today.getFullYear();
    
    updateBangla();
  }

  function updateGregorian() {
    const bDay = parseInt(banglaDaySelect.value);
    const bMonth = parseInt(banglaMonthSelect.value);
    const bYear = parseInt(banglaYearInput.value);

    if (isNaN(bDay) || isNaN(bMonth) || isNaN(bYear) || bYear < 1) {
      return;
    }
    
    let gYear = bYear + BANGLA_YEAR_OFFSET;
    const pohelaBoishakh = new Date(gYear, 3, 14);

    let totalDays = 0;
    for (let i = 1; i < bMonth; i++) {
      totalDays += (i <= 5) ? 31 : 30;
    }
    totalDays += bDay - 1;

    const resultDate = new Date(pohelaBoishakh.getTime());
    resultDate.setDate(pohelaBoishakh.getDate() + totalDays);
    
    englishDaySelect.value = resultDate.getDate();
    englishMonthSelect.value = resultDate.getMonth() + 1;
    englishYearInput.value = resultDate.getFullYear();
  }

  function updateBangla() {
    const gDay = parseInt(englishDaySelect.value);
    const gMonth = parseInt(englishMonthSelect.value);
    const gYear = parseInt(englishYearInput.value);

    if (isNaN(gDay) || isNaN(gMonth) || isNaN(gYear) || gYear < 1) {
      return;
    }
    
    const inputDate = new Date(gYear, gMonth - 1, gDay);
    
    let bYear;
    const pohelaBoishakhThisYear = new Date(gYear, 3, 14);
    if (inputDate < pohelaBoishakhThisYear) {
      bYear = gYear - BANGLA_YEAR_OFFSET - 1;
    } else {
      bYear = gYear - BANGLA_YEAR_OFFSET;
    }
    
    const pohelaBoishakhOfCurrentBanglaYear = new Date(bYear + BANGLA_YEAR_OFFSET, 3, 14);
    const timeDiff = inputDate.getTime() - pohelaBoishakhOfCurrentBanglaYear.getTime();
    let daysPassed = Math.round(timeDiff / (1000 * 60 * 60 * 24)) + 1;

    let bMonth, bDay;
    const banglaMonthDays = [31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 30, 30];
    if (isGregorianLeap(bYear + BANGLA_YEAR_OFFSET + 1)) {
      banglaMonthDays[10] = 31; // Falgun has 31 days in leap years
    }

    for (let i = 0; i < banglaMonthDays.length; i++) {
      if (daysPassed <= banglaMonthDays[i]) {
        bMonth = i + 1;
        bDay = daysPassed;
        break;
      }
      daysPassed -= banglaMonthDays[i];
    }

    if (bDay && bMonth && bYear) {
      banglaDaySelect.value = bDay;
      banglaMonthSelect.value = bMonth;
      banglaYearInput.value = bYear;
    }
  }

  banglaDaySelect.addEventListener('change', updateGregorian);
  banglaMonthSelect.addEventListener('change', updateGregorian);
  banglaYearInput.addEventListener('input', updateGregorian);

  englishDaySelect.addEventListener('change', updateBangla);
  englishMonthSelect.addEventListener('change', updateBangla);
  englishYearInput.addEventListener('input', updateBangla);
  
  document.addEventListener('DOMContentLoaded', initialize);
</script>
