  <meta charset="utf-8"/>

</head>
<body class="bg-background text-on-surface font-body-md selection:bg-primary-fixed selection:text-on-primary-fixed">

<main class="max-w-container-max mx-auto px-gutter py-stack-lg min-h-screen">
  <!-- Breadcrumbs & Tool Header -->
  <div class="mb-stack-lg">
    <nav class="flex items-center text-body-sm text-text-secondary mb-base">
      <a class="hover:text-primary no-underline" href="../">Tools</a>
      <span class="material-symbols-outlined text-[14px] mx-base">chevron_right</span>
      <span class="text-on-surface">আজকের এই দিনে</span>
    </nav>
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-stack-md border-b border-border-subtle pb-stack-md">
      <div>
        <h1 class="font-headline-md text-headline-md font-bold">আজকের এই দিনে</h1>
        <p class="text-text-secondary mt-base font-body-md" id="current-date">...</p>
      </div>
    </div>
  </div>

  <!-- Loading Spinner -->
  <div id="loader" class="flex justify-center items-center py-24">
    <div class="flex items-center gap-3 text-text-secondary">
      <span class="material-symbols-outlined animate-spin text-[36px] text-primary">sync</span>
      <span class="font-semibold">তথ্য লোড করা হচ্ছে...</span>
    </div>
  </div>

  <!-- Error Message -->
  <div id="error-message" class="hidden p-stack-md bg-error-container text-error rounded border border-error/20 font-semibold my-8 text-center">
    <h2>একটি সমস্যা হয়েছে!</h2>
    <p class="text-body-sm mt-1">দুঃখিত, এই মুহূর্তে তথ্য আনা সম্ভব হচ্ছে না। অনুগ্রহ করে কিছুক্ষণ পর আবার চেষ্টা করুন।</p>
  </div>

  <!-- Main Content Area -->
  <main id="content" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-stack-lg mb-24">
    <!-- Events Section -->
    <section class="bg-surface-container-lowest border border-border-subtle rounded p-stack-md shadow-sm">
      <div class="flex items-center gap-stack-sm border-b border-border-subtle pb-base mb-stack-md">
        <span class="material-symbols-outlined text-chrono-event">history</span>
        <h2 class="text-headline-sm font-bold text-on-surface">ঐতিহাসিক ঘটনা</h2>
      </div>
      <ul id="events-list" class="space-y-stack-md p-0 list-none m-0"></ul>
    </section>

    <!-- Births Section -->
    <section class="bg-surface-container-lowest border border-border-subtle rounded p-stack-md shadow-sm">
      <div class="flex items-center gap-stack-sm border-b border-border-subtle pb-base mb-stack-md">
        <span class="material-symbols-outlined text-wiki-project">cake</span>
        <h2 class="text-headline-sm font-bold text-on-surface">জন্মদিন</h2>
      </div>
      <ul id="births-list" class="space-y-stack-md p-0 list-none m-0"></ul>
    </section>

    <!-- Deaths Section -->
    <section class="bg-surface-container-lowest border border-border-subtle rounded p-stack-md shadow-sm">
      <div class="flex items-center gap-stack-sm border-b border-border-subtle pb-base mb-stack-md">
        <span class="material-symbols-outlined text-error">sentiment_very_dissatisfied</span>
        <h2 class="text-headline-sm font-bold text-on-surface">মৃত্যুবার্ষিকী</h2>
      </div>
      <ul id="deaths-list" class="space-y-stack-md p-0 list-none m-0"></ul>
    </section>
  </main>
</main>

<script src="../yt-shell.js"></script>
<script>
  const loader = document.getElementById('loader');
  const content = document.getElementById('content');
  const errorMessage = document.getElementById('error-message');
  const dateDisplay = document.getElementById('current-date');

  const lists = {
    events: document.getElementById('events-list'),
    births: document.getElementById('births-list'),
    deaths: document.getElementById('deaths-list')
  };

  // Convert numbers to Bengali numerals
  function toBengaliNumber(num) {
    const bengaliDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
    return String(num).replace(/\d/g, digit => bengaliDigits[parseInt(digit)]);
  }

  // Format date in Bengali
  function formatBengaliDate() {
    const now = new Date();
    const day = toBengaliNumber(now.getDate());
    const year = toBengaliNumber(now.getFullYear());
    const monthNames = ["জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন", "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর"];
    const month = monthNames[now.getMonth()];
    return `আজ ${day} ${month}, ${year} ইং`;
  }

  // Create list item element
  function createListItem(item) {
    const listItem = document.createElement('li');
    listItem.className = 'flex items-start gap-stack-sm border-b border-surface-container pb-stack-sm last:border-none';
    
    const pageLink = item.pages && item.pages.length > 0 ? item.pages[0].content_urls.desktop.page : '#';

    listItem.innerHTML = `
      <span class="text-primary font-code font-bold w-12 shrink-0 text-left">${toBengaliNumber(item.year)}</span>
      <span class="flex-1 text-body-sm text-on-surface-variant">
        <a href="${pageLink}" target="_blank" rel="noopener noreferrer" class="hover:text-primary hover:underline text-on-surface no-underline">
          ${item.text}
        </a>
      </span>`;
    return listItem;
  }

  function createEmptyMessage(message) {
    const listItem = document.createElement('li');
    listItem.className = 'text-text-secondary italic text-body-sm py-4';
    listItem.textContent = message;
    return listItem;
  }

  async function fetchOnThisDay() {
    const now = new Date();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    
    const apiUrl = `https://api.wikimedia.org/feed/v1/wikipedia/en/onthisday/all/${month}/${day}`;

    try {
      const response = await fetch(apiUrl, { headers: { 'Accept': 'application/json' } });
      if (!response.ok) throw new Error();
      const data = await response.json();

      // Populate Events
      if (data.events && data.events.length > 0) {
        data.events.slice(0, 30).forEach(event => lists.events.appendChild(createListItem(event)));
      } else {
        lists.events.appendChild(createEmptyMessage('আজকের দিনে কোনো বিশেষ ঘটনা নেই।'));
      }

      // Populate Births
      if (data.births && data.births.length > 0) {
        data.births.slice(0, 30).forEach(birth => lists.births.appendChild(createListItem(birth)));
      } else {
        lists.births.appendChild(createEmptyMessage('আজকের দিনে কোনো উল্লেখযোগ্য जन्मदिन নেই।'));
      }

      // Populate Deaths
      if (data.deaths && data.deaths.length > 0) {
        data.deaths.slice(0, 30).forEach(death => lists.deaths.appendChild(createListItem(death)));
      } else {
        lists.deaths.appendChild(createEmptyMessage('আজকের দিনে কোনো উল্লেখযোগ্য মৃত্যুবার্ষিকী নেই।'));
      }

      loader.style.display = 'none';
      content.classList.remove('hidden');

    } catch (error) {
      console.error(error);
      loader.style.display = 'none';
      errorMessage.classList.remove('hidden');
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    dateDisplay.textContent = formatBengaliDate();
    fetchOnThisDay();
  });
</script>
</body>
