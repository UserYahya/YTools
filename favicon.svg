<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="y-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#094cb2" />
    </linearGradient>
    <linearGradient id="y-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- Subtle background backing for dark/light tab contrast -->
  <circle cx="16" cy="16" r="14" fill="#ffffff" fill-opacity="0.08" />
  
  <!-- Left wing and stem (Primary brand color gradient) -->
  <path d="M 6,6 C 8,11 12,15 16,17 L 16,27" stroke="url(#y-grad-1)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right wing (Brighter accent color gradient) -->
  <path d="M 26,6 C 24,11 20,15 16,17" stroke="url(#y-grad-2)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- A central small decorative node representing community/data connectivity -->
  <circle cx="16" cy="17" r="2.5" fill="#ffffff" />
</svg>
