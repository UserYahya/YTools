              'code': ['13px', {lineHeight: '20px', fontWeight: '400'}],

  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }
    .quiet-shadow {
      box-shadow: 0 2px 2px 0 rgba(0,0,0,0.1);
    }
    body {
      font-family: 'Inter', sans-serif !important;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Source Serif 4', serif !important;
    }
    code, pre, .font-code {
      font-family: 'JetBrains Mono', monospace !important;
    }
  </style>

  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Wikipedia Word Counter - YTools</title>
</head>
<body class="bg-background text-on-surface font-body-md selection:bg-primary-fixed selection:text-on-primary-fixed">

<main class="max-w-container-max mx-auto px-gutter py-stack-lg min-h-screen">
  <!-- Breadcrumbs & Tool Header -->
  <div class="mb-stack-lg">
    <nav class="flex items-center text-body-sm text-text-secondary mb-base">
      <a class="hover:text-primary no-underline" href="../">Tools</a>
      <span class="material-symbols-outlined text-[14px] mx-base">chevron_right</span>
      <span class="text-on-surface">Word Counter</span>
    </nav>
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-stack-md border-b border-border-subtle pb-stack-md">
      <div>
        <h1 class="font-headline-md text-headline-md font-bold">Wikipedia Word Counter / শব্দগণক</h1>
        <p class="text-text-secondary mt-base font-body-md">Calculate the clean word count for any list of Wikipedia articles. Infoboxes, categories, and references are automatically excluded.</p>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-stack-lg">
    <!-- Input Card -->
    <div class="lg:col-span-5">
      <div class="bg-surface border border-border-subtle p-stack-md rounded flex flex-col gap-stack-sm">
        <div class="form-group flex flex-col gap-base">
          <label class="font-label-md text-label-md text-on-surface" for="siteInput">Wiki Domain</label>
          <input class="px-stack-md py-stack-sm bg-surface-subtle border border-border-subtle rounded focus:ring-1 focus:ring-primary focus:border-primary text-code font-code" id="siteInput" placeholder="e.g. bn.wikipedia.org" value="bn.wikipedia.org" type="text" autocomplete="off"/>
        </div>

        <div class="form-group flex flex-col gap-base">
          <label class="font-label-md text-label-md text-on-surface flex justify-between" for="articleInput">
            <span>Article Titles</span>
            <span class="text-body-sm text-text-secondary font-normal">(one per line)</span>
          </label>
          <textarea class="w-full h-48 bg-surface-subtle border border-border-subtle p-stack-sm font-body-md focus:ring-1 focus:ring-primary focus:border-primary outline-none resize-none rounded" id="articleInput" placeholder="নিবন্ধের নাম দিন (e.g. বাংলাদেশ)"></textarea>
        </div>

        <div class="hidden w-full bg-surface-container-highest h-1.5 rounded-full overflow-hidden mb-2" id="progress-container">
          <div class="bg-secondary h-full transition-all duration-300" id="progress-bar" style="width: 0%"></div>
        </div>

        <button class="w-full bg-primary text-on-primary font-label-md text-label-md py-stack-sm hover:opacity-90 active:opacity-80 transition-all rounded flex items-center justify-center gap-base" id="countButton" onclick="countWordsForMultipleArticles()">
          <span class="material-symbols-outlined text-[18px]" id="btn-icon">format_list_numbered</span>
          <span id="btn-text">শব্দ গুনুন / Count Words</span>
        </button>
      </div>
    </div>

    <!-- Output Card -->
    <div class="lg:col-span-7 flex flex-col">
      <div class="bg-surface border border-border-subtle rounded flex-grow flex flex-col overflow-hidden min-h-[350px]">
        <div class="bg-surface-subtle border-b border-border-subtle px-stack-md py-stack-sm flex justify-between items-center">
          <h2 class="font-label-md text-label-md text-on-surface uppercase tracking-wider">Wikitext Output</h2>
          <button class="bg-white hover:bg-surface-container border border-border-subtle text-primary font-bold px-3 py-1.5 rounded text-body-sm transition-all hidden flex items-center gap-base" id="copyButton" onclick="copyToClipboard()">
            <span class="material-symbols-outlined text-[16px]">content_copy</span> ক্লিপবোর্ডে অনুলিপি / Copy
          </button>
        </div>

        <div class="p-stack-md flex-grow overflow-auto bg-surface-container-lowest font-code text-code break-all whitespace-pre-wrap text-on-surface-variant leading-relaxed" id="result">
          <div class="flex flex-col items-center justify-center h-full text-text-secondary opacity-50 py-12">
            <span class="material-symbols-outlined text-[48px] mb-base">table_chart</span>
            <p>Results will be displayed here in Wikitable format.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="../yt-shell.js"></script>
<script>
  async function countWordsForMultipleArticles() {
    const site = document.getElementById('siteInput').value.trim();
    const articleInput = document.getElementById('articleInput');
    const articleNames = articleInput.value
      .split('\n')
      .map(name => name.trim())
      .filter(name => name !== '');

    if (articleNames.length === 0) {
      alert('অনুগ্রহ করে কমপক্ষে একটি নিবন্ধের নাম লিখুন / Please enter at least one article title.');
      return;
    }

    const countButton = document.getElementById('countButton');
    const btnIcon = document.getElementById('btn-icon');
    const btnText = document.getElementById('btn-text');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const copyButton = document.getElementById('copyButton');
    const resultDiv = document.getElementById('result');

    countButton.disabled = true;
    btnIcon.textContent = 'sync';
    btnIcon.classList.add('animate-spin');
    btnText.textContent = 'গণনা করা হচ্ছে...';
    progressContainer.classList.remove('hidden');
    progressBar.style.width = '0%';
    copyButton.classList.add('hidden');

    const totalArticles = articleNames.length;
    let processed = 0;

    try {
      const results = await Promise.all(articleNames.map(async (articleName) => {
        const result = await getWordCount(site, articleName);
        processed++;
        progressBar.style.width = `${(processed / totalArticles) * 100}%`;
        return { articleName, result };
      }));

      const isBengali = site.startsWith('bn.');
      let wikitext = `{| class="wikitable sortable"\n! ${isBengali ? 'নিবন্ধের নাম' : 'Article Title'} !! ${isBengali ? 'শব্দসংখ্যা' : 'Word Count'}\n|-\n`;
      let totalWords = 0;

      results.forEach(({ articleName, result }) => {
        if (typeof result.count === 'number') {
          totalWords += result.count;
          const displayCount = isBengali ? result.count.toLocaleString('bn') : result.count.toLocaleString();
          wikitext += `| [[${articleName}]] || ${displayCount}\n|-\n`;
        } else {
          wikitext += `| ${articleName} || ${isBengali ? result.error : 'Not found/Error'}\n|-\n`;
        }
      });

      const displayTotal = isBengali ? totalWords.toLocaleString('bn') : totalWords.toLocaleString();
      wikitext += `| '''${isBengali ? 'মোট শব্দ' : 'Total Words'}''' || '''${displayTotal}'''\n|}`;
      
      resultDiv.textContent = wikitext;
      resultDiv.classList.remove('text-error');
      copyButton.classList.remove('hidden');
    } catch (error) {
      console.error(error);
      resultDiv.textContent = '⚠ কিছু ত্রুটি হয়েছে। অনুগ্রহপূর্বক আবার চেষ্টা করুন। / An error occurred. Please try again.';
      resultDiv.classList.add('text-error');
    } finally {
      countButton.disabled = false;
      btnIcon.textContent = 'format_list_numbered';
      btnIcon.classList.remove('animate-spin');
      btnText.textContent = 'শব্দ গুনুন / Count Words';
      progressContainer.classList.add('hidden');
      progressBar.style.width = '0%';
    }
  }

  async function getWordCount(site, title) {
    try {
      const apiUrl = `https://${site}/w/api.php?action=parse&page=${encodeURIComponent(title)}&format=json&prop=text&origin=*`;
      const response = await fetch(apiUrl);
      if (!response.ok) throw new Error();
      const data = await response.json();

      if (data.error) {
        return { error: 'নিবন্ধ পাওয়া যায়নি' };
      }

      const htmlContent = data.parse.text['*'];
      const cleanHtml = htmlContent.replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>|<noscript[\s\S]*?<\/noscript>/gi, '');
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = cleanHtml;

      const unwantedSelectors = [
        '.mw-empty-elt', '.mw-editsection', '.reference', '.references',
        '.reflist', '.mbox-small', '.ambox', '.navbox', '.catlinks',
        '.noprint', '.metadata', '.portal',
        'style', 'script', '.thumbinner', '.listing-lastedit'
      ].join(',');

      tempDiv.querySelectorAll(unwantedSelectors).forEach(el => el.remove());
      const content = tempDiv.textContent || "";

      const wordCount = site.startsWith('bn.')
        ? (content.match(/[\u0980-\u09FF]+/g) || []).length
        : content.split(/\s+/).filter(word => word.length > 0).length;

      return { count: wordCount };
    } catch (error) {
      console.error(error);
      return { error: 'প্রক্রিয়াকরণে ত্রুটি' };
    }
  }

  function copyToClipboard() {
    const resultText = document.getElementById('result').textContent;
    navigator.clipboard.writeText(resultText).then(() => {
      const copyButton = document.getElementById('copyButton');
      const origText = copyButton.innerHTML;
      copyButton.innerHTML = '<span class="material-symbols-outlined text-[16px]">check</span> কপিড / Copied';
      setTimeout(() => {
        copyButton.innerHTML = origText;
      }, 1500);
    }).catch(err => {
      console.error(err);
      alert('Copy failed.');
    });
  }
</script>
</body>
</html>
