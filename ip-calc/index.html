<body class="bg-background text-on-surface font-body-md selection:bg-primary-fixed selection:text-on-primary-fixed">

<main class="max-w-container-max mx-auto px-gutter py-stack-lg min-h-screen">
  <!-- Breadcrumbs & Tool Header -->
  <div class="mb-stack-lg">
    <nav class="flex items-center text-body-sm text-text-secondary mb-base">
      <a class="hover:text-primary no-underline" href="../">Tools</a>
      <span class="material-symbols-outlined text-[14px] mx-base">chevron_right</span>
      <span class="text-on-surface">IP Range Calculator</span>
    </nav>
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-stack-md border-b border-border-subtle pb-stack-md">
      <div>
        <h1 class="font-headline-md text-headline-md font-bold">IP Range Calculator</h1>
        <p class="text-text-secondary mt-base font-body-md">Calculate the smallest CIDR range that covers a list of IP addresses. Supports IPv4 and IPv6.</p>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-stack-lg">
    <!-- Input Column -->
    <div class="lg:col-span-5">
      <div class="bg-surface border border-border-subtle p-stack-md rounded flex flex-col gap-stack-sm">
        <div class="form-group flex flex-col gap-base">
          <label class="font-label-md text-label-md text-on-surface flex justify-between" for="ipInput">
            <span>IP Addresses</span>
            <span class="text-body-sm text-text-secondary font-normal">(one per line, minimum 2)</span>
          </label>
          <textarea class="w-full h-48 bg-surface-subtle border border-border-subtle p-stack-sm font-code text-code focus:ring-1 focus:ring-primary focus:border-primary outline-none resize-none rounded" id="ipInput" placeholder="192.168.1.10&#10;192.168.1.50&#10;192.168.1.200"></textarea>
        </div>
        
        <div class="form-group">
          <span class="font-label-md text-label-md text-on-surface block mb-base">IP Version</span>
          <div class="flex gap-stack-lg mt-1">
            <label class="flex items-center gap-stack-sm cursor-pointer text-body-sm">
              <input type="radio" name="ipType" value="ipv4" checked class="text-primary focus:ring-0 focus:ring-offset-0">
              <span>IPv4</span>
            </label>
            <label class="flex items-center gap-stack-sm cursor-pointer text-body-sm">
              <input type="radio" name="ipType" value="ipv6" class="text-primary focus:ring-0 focus:ring-offset-0">
              <span>IPv6</span>
            </label>
          </div>
        </div>

        <button class="w-full bg-primary text-on-primary font-label-md text-label-md py-stack-sm hover:opacity-90 active:opacity-80 transition-all rounded flex items-center justify-center gap-base" onclick="calculateRange()">
          <span class="material-symbols-outlined text-[18px]">calculate</span> Calculate Range
        </button>
      </div>
    </div>

    <!-- Output Column -->
    <div class="lg:col-span-7">
      <div id="output">
        <div class="bg-surface border border-border-subtle p-24 text-center rounded flex flex-col items-center justify-center text-text-secondary min-h-[250px]">
          <span class="material-symbols-outlined text-[48px] opacity-40 mb-base">table_chart</span>
          <p class="font-body-md">Enter IP addresses and click calculate to see the resulting CIDR subnet.</p>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="../yt-shell.js"></script>
<script>
  function ipToBinary(ip, type) {
    if (type === 'ipv4') {
      return ip.split('.').map(o => {
        const val = parseInt(o);
        if (isNaN(val) || val < 0 || val > 255) throw new Error();
        return val.toString(2).padStart(8, '0');
      }).join('');
    }
    
    // IPv6 parsing
    let parts = ip.split(':');
    if (parts.length > 8) throw new Error();
    let full = [];
    let doubleColonIdx = parts.indexOf('');
    
    for (let i = 0; i < parts.length; i++) {
      if (parts[i] === '') {
        if (doubleColonIdx !== -1 && i === doubleColonIdx) {
          const missingCount = 8 - (parts.filter(Boolean).length);
          for (let j = 0; j < missingCount; j++) {
            full.push('0000000000000000');
          }
          doubleColonIdx = -2; // ensure only one expand
        }
      } else {
        const val = parseInt(parts[i], 16);
        if (isNaN(val) || val < 0 || val > 65535) throw new Error();
        full.push(val.toString(2).padStart(16, '0'));
      }
    }
    
    if (full.length !== 8) throw new Error();
    return full.join('');
  }

  function binaryToIp(bin, type) {
    if (type === 'ipv4') {
      return bin.match(/.{8}/g).map(b => parseInt(b, 2)).join('.');
    }
    return bin.match(/.{16}/g).map(b => parseInt(b, 2).toString(16)).join(':');
  }

  function calculateRange() {
    const raw = document.getElementById('ipInput').value.trim();
    const type = document.querySelector('input[name="ipType"]:checked').value;
    const out = document.getElementById('output');
    
    if (!raw) {
      out.innerHTML = `
        <div class="p-stack-md bg-error-container text-error rounded border border-error/20 font-semibold">
          Please enter at least 2 IP addresses.
        </div>`;
      return;
    }
    
    const ips = raw.split('\n').map(s => s.trim()).filter(Boolean);
    if (ips.length < 2) {
      out.innerHTML = `
        <div class="p-stack-md bg-error-container text-error rounded border border-error/20 font-semibold">
          Please enter at least 2 IP addresses (one per line).
        </div>`;
      return;
    }
    
    try {
      const binaries = ips.map(ip => ipToBinary(ip, type));
      let prefix = binaries[0];
      
      for (let i = 1; i < binaries.length; i++) {
        let c = '';
        for (let j = 0; j < Math.min(prefix.length, binaries[i].length); j++) {
          if (prefix[j] === binaries[i][j]) {
            c += prefix[j];
          } else {
            break;
          }
        }
        prefix = c;
      }
      
      const prefixLen = prefix.length;
      const totalBits = type === 'ipv4' ? 32 : 128;
      const network = binaryToIp(prefix.padEnd(totalBits, '0'), type);
      const cidr = `${network}/${prefixLen}`;
      
      // Calculate host count
      let hostCountStr = '';
      if (type === 'ipv4') {
        const hostCount = Math.pow(2, totalBits - prefixLen);
        hostCountStr = hostCount.toLocaleString();
      } else {
        const power = totalBits - prefixLen;
        if (power < 31) {
          hostCountStr = Math.pow(2, power).toLocaleString();
        } else {
          hostCountStr = `2^${power} addresses`;
        }
      }
      
      const blockUrl = `https://meta.wikimedia.org/wiki/Special:GlobalBlock?wpAddress=${encodeURIComponent(cidr)}&wpExpiry=indefinite`;
      const enwikiUrl = `https://en.wikipedia.org/wiki/Special:Block/${encodeURIComponent(cidr)}`;
      
      out.innerHTML = `
        <div class="bg-surface-container-lowest border border-border-subtle rounded p-stack-md flex flex-col gap-stack-sm">
          <div class="flex items-center justify-between border-b border-border-subtle pb-base mb-base">
            <h3 class="font-label-md text-label-md text-text-secondary uppercase tracking-wider">Calculation Result</h3>
            <span class="bg-primary/10 text-primary text-[10px] px-2 py-0.5 rounded font-bold uppercase">CIDR BLOCK</span>
          </div>
          
          <div class="bg-surface-subtle border border-border-subtle p-stack-md rounded flex items-center justify-between mb-stack-sm">
            <div>
              <div class="text-[11px] text-text-secondary uppercase font-semibold">Calculated CIDR</div>
              <div class="text-headline-md font-code font-bold text-primary">${cidr}</div>
            </div>
            <button class="bg-white hover:bg-surface-container border border-border-subtle text-primary font-bold px-3 py-1.5 rounded text-body-sm transition-all" onclick="navigator.clipboard.writeText('${cidr}')">
              📋 Copy CIDR
            </button>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-body-md border-collapse">
              <tbody>
                <tr class="border-b border-surface-container hover:bg-surface-subtle transition-colors">
                  <td class="py-stack-sm px-stack-md bg-surface-subtle/50 font-label-md w-1/3">Network Address</td>
                  <td class="py-stack-sm px-stack-md font-code">${network}</td>
                </tr>
                <tr class="border-b border-surface-container hover:bg-surface-subtle transition-colors">
                  <td class="py-stack-sm px-stack-md bg-surface-subtle/50 font-label-md">Prefix Length</td>
                  <td class="py-stack-sm px-stack-md font-code">/${prefixLen}</td>
                </tr>
                <tr class="border-b border-surface-container hover:bg-surface-subtle transition-colors">
                  <td class="py-stack-sm px-stack-md bg-surface-subtle/50 font-label-md">Addresses Covered</td>
                  <td class="py-stack-sm px-stack-md font-body-md">${hostCountStr}</td>
                </tr>
                <tr class="hover:bg-surface-subtle transition-colors">
                  <td class="py-stack-sm px-stack-md bg-surface-subtle/50 font-label-md">IPs Analyzed</td>
                  <td class="py-stack-sm px-stack-md font-body-md">${ips.length}</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="border-t border-border-subtle mt-stack-md pt-stack-md flex flex-wrap gap-2">
            <a class="bg-white hover:bg-surface-container-low text-primary border border-border-subtle px-3 py-1.5 rounded text-body-sm font-semibold no-underline transition-all flex items-center gap-1" href="${blockUrl}" target="_blank" rel="noopener">
              🚫 Global block range
            </a>
            <a class="bg-white hover:bg-surface-container-low text-primary border border-border-subtle px-3 py-1.5 rounded text-body-sm font-semibold no-underline transition-all flex items-center gap-1" href="${enwikiUrl}" target="_blank" rel="noopener">
              🔒 Block on enwiki
            </a>
          </div>
        </div>`;
    } catch(e) {
      out.innerHTML = `
        <div class="p-stack-md bg-error-container text-error rounded border border-error/20 font-semibold">
          ⚠ Could not parse the IP addresses. Please verify that all inputs match the selected IP version format.
        </div>`;
    }
  }
</script>
