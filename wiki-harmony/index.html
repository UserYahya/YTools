<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <!-- Tailwind CSS & Google Fonts (Static Injection) -->

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <script id="tailwind-config">

              'on-secondary': '#ffffff',

              'outline-variant': '#c3c6d5',

              'on-primary-fixed-variant': '#00419d',
              'on-secondary-fixed-variant': '#00513e',
              'primary-container': '#3366cc',
              'on-surface': '#1b1c1d',
              'error': '#ba1a1a',

              'on-tertiary-fixed-variant': '#713700',
              'inverse-on-surface': '#f2f0f1',
              'surface': '#faf9fa',

              'primary-fixed': '#d9e2ff',
              'on-surface-variant': '#434653',
              'chrono-event': '#E67E22',
              'secondary-container': '#74facf',
              'on-tertiary-container': '#ffe7d9',
              'on-tertiary': '#ffffff',
              'on-secondary-fixed': '#002117',
              'surface-dim': '#dbdadb',
              'primary': '#094cb2',
              'primary-fixed-dim': '#b1c5ff',
              'border-subtle': '#A2A9B1',
              'ip-network': '#3366CC',
              'surface-container-high': '#e9e8e9',
              'on-error-container': '#93000a',

              'inverse-surface': '#303031',
              'secondary-fixed': '#74facf',
              'wiki-project': '#00AF89',
              'tertiary-fixed-dim': '#ffb783'
            },
            borderRadius: {
              'DEFAULT': '0.125rem',
              'lg': '0.25rem',

            },
            spacing: {

              'stack-sm': '8px',
              'margin-mobile': '12px',

              'stack-md': '16px'
            },
            fontFamily: {
              'body-lg': ['Inter', 'sans-serif'],
              'label-md': ['Inter', 'sans-serif'],
              'display-lg': ['Source Serif 4', 'serif'],
              'headline-sm': ['Source Serif 4', 'serif'],
              'code': ['JetBrains Mono', 'monospace'],
              'body-md': ['Inter', 'sans-serif'],
              'body-sm': ['Inter', 'sans-serif'],
              'headline-md': ['Source Serif 4', 'serif']
            },
            fontSize: {
              'body-lg': ['16px', {lineHeight: '24px', fontWeight: '400'}],
              'label-md': ['13px', {lineHeight: '16px', fontWeight: '600'}],
              'display-lg': ['32px', {lineHeight: '40px', fontWeight: '400'}],
              'headline-sm': ['20px', {lineHeight: '28px', fontWeight: '400'}],
              'code': ['13px', {lineHeight: '20px', fontWeight: '400'}],
              'body-md': ['14px', {lineHeight: '20px', fontWeight: '400'}],
              'body-sm': ['12px', {lineHeight: '18px', fontWeight: '400'}],
              'headline-md': ['24px', {lineHeight: '32px', fontWeight: '400'}]
            }
          }
        }
      }
    };
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }
    .quiet-shadow {
      box-shadow: 0 2px 2px 0 rgba(0,0,0,0.1);
    }
    body {
      font-family: 'Inter', sans-serif !important;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Source Serif 4', serif !important;
    }
    code, pre, .font-code {
      font-family: 'JetBrains Mono', monospace !important;
    }
  </style>

  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>WikiHarmony - YTools</title>
  <style>
    body {
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #visualizer {
      width: 100%;
      height: 100%;
      display: block;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .feed-item {
      animation: slideIn 0.3s forwards;
    }
    @keyframes slideIn {
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body class="bg-[#050508] text-on-surface font-body-md selection:bg-primary-fixed">

<!-- Content Area (Canvas and Overlay UI) -->
<div class="relative flex-grow w-full overflow-hidden flex flex-col">
  <!-- Visualizer Canvas -->
  <canvas id="visualizer" class="absolute inset-0 z-0"></canvas>

  <!-- Overlay UI Layer -->
  <div class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-stack-md">
    
    <!-- Top Row Controls -->
    <div class="flex justify-between items-start w-full pointer-events-auto">
      <div class="glass-panel border border-border-subtle/50 px-stack-md py-base rounded flex items-center gap-stack-sm shadow-sm">
        <span class="w-2.5 h-2.5 rounded-full bg-outline-variant animate-pulse" id="connection-status-dot"></span>
        <span class="text-body-sm font-semibold text-text-secondary" id="connection-status">Disconnected</span>
      </div>
      <button class="glass-panel border border-border-subtle/50 text-primary hover:bg-surface-container-low transition-colors px-3 py-1.5 rounded text-body-sm font-semibold flex items-center gap-base shadow-sm" id="mute-btn">
        <span class="material-symbols-outlined text-[18px]" id="volume-icon">volume_up</span> Mute Audio
      </button>
    </div>

    <!-- Middle/Bottom Row: Feed on left, Legend on right -->
    <div class="flex flex-col md:flex-row justify-between items-end w-full gap-stack-md mt-auto pointer-events-auto">
      <!-- Live Feed -->
      <div id="feed" class="w-full max-w-[280px] flex flex-col gap-2 max-h-[300px] overflow-hidden pointer-events-auto">
        <!-- Feed items injected dynamically -->
      </div>

      <!-- Legend -->
      <div class="glass-panel border border-border-subtle/50 p-stack-md rounded shadow-sm text-body-sm flex flex-col gap-2 w-full max-w-[200px] pointer-events-auto">
        <div class="flex items-center gap-base">
          <div class="w-2.5 h-2.5 rounded-full bg-[#22C55E]"></div>
          <span class="text-on-surface font-semibold text-body-sm">Content Added</span>
        </div>
        <div class="flex items-center gap-base">
          <div class="w-2.5 h-2.5 rounded-full bg-[#EF4444]"></div>
          <span class="text-on-surface font-semibold text-body-sm">Content Removed</span>
        </div>
        <div class="flex items-center gap-base">
          <div class="w-2.5 h-2.5 rounded-full bg-[#A78BFA]"></div>
          <span class="text-on-surface font-semibold text-body-sm">New User</span>
        </div>
        <p class="text-[10px] text-text-secondary italic mt-1 border-t border-border-subtle/30 pt-1">
          Pitch correlates to edit size. Bots are filtered out.
        </p>
      </div>
    </div>
  </div>

  <!-- Start Overlay Screen -->
  <div id="overlay" class="absolute inset-0 z-20 bg-[#050508]/95 flex flex-col items-center justify-center p-gutter transition-opacity duration-500 pointer-events-auto">
    <div class="text-center max-w-md">
      <span class="material-symbols-outlined text-primary text-[64px] mb-stack-md">music_note</span>
      <h2 class="text-display-lg font-headline-md text-white font-bold leading-tight mb-base">WikiHarmony</h2>
      <p class="text-body-lg text-text-secondary mb-stack-lg leading-relaxed">
        An interactive audio-visual visualizer. Experience the sound of human edits on Wikipedia, translated in real-time to pentatonic bells, plucks, and ambient swells.
      </p>
      <button id="start-btn" class="bg-primary text-on-primary font-bold px-6 py-3 rounded-full text-body-lg hover:opacity-95 active:scale-95 transition-all shadow-lg inline-flex items-center gap-stack-sm">
        <span class="material-symbols-outlined">play_arrow</span> Initialize System
      </button>
    </div>
  </div>
</div>

<script src="../yt-shell.js"></script>
<script>
  // --- Configuration ---
  const CONFIG = {
    maxParticles: 50,
    maxFeedItems: 5,
    streamUrl: 'https://stream.wikimedia.org/v2/stream/recentchange',
    colors: {
      add: 'rgba(34, 197, 94, 1)',      // Green #22C55E
      sub: 'rgba(239, 68, 68, 1)',      // Red #EF4444
      newuser: 'rgba(167, 139, 250, 1)',  // Purple #A78BFA
      neutral: 'rgba(51, 102, 204, 1)'  // Blue #3366CC
    }
  };

  // --- Global State ---
  let audioCtx;
  let isMuted = false;
  let particles = [];
  let eventSource;
  const canvas = document.getElementById('visualizer');
  const ctx = canvas.getContext('2d');
  const feedContainer = document.getElementById('feed');
  const statusEl = document.getElementById('connection-status');
  const statusDot = document.getElementById('connection-status-dot');

  // E Major Pentatonic Scale
  const SCALE = [
    164.81, 196.00, 246.94, 293.66, 329.63, // E3, G3, B3, D4, E4
    392.00, 493.88, 587.33, 659.25, 783.99, // G4, B4, D5, E5, G5
    987.77, 1174.66, 1318.51               // B5, D6, E6
  ];

  // --- Audio Engine ---
  class AudioEngine {
    constructor() {
      this.masterGain = null;
      this.reverbNode = null;
    }

    init() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      this.masterGain = audioCtx.createGain();
      this.masterGain.gain.value = 0.4;

      this.reverbNode = audioCtx.createConvolver();
      this.reverbNode.buffer = this.createReverbBuffer(audioCtx);
      
      const dryGain = audioCtx.createGain();
      const wetGain = audioCtx.createGain();
      dryGain.gain.value = 0.7;
      wetGain.gain.value = 0.4;

      this.inputNode = audioCtx.createGain();
      this.inputNode.connect(dryGain);
      this.inputNode.connect(wetGain);
      
      dryGain.connect(this.masterGain);
      wetGain.connect(this.reverbNode);
      this.reverbNode.connect(this.masterGain);

      this.masterGain.connect(audioCtx.destination);
    }

    createReverbBuffer(ctx) {
      const duration = 2.5;
      const decay = 2.0;
      const sampleRate = ctx.sampleRate;
      const length = sampleRate * duration;
      const impulse = ctx.createBuffer(2, length, sampleRate);
      const left = impulse.getChannelData(0);
      const right = impulse.getChannelData(1);

      for (let i = 0; i < length; i++) {
        const n = i / length;
        const val = (Math.random() * 2 - 1) * Math.pow(1 - n, decay);
        left[i] = val;
        right[i] = val;
      }
      return impulse;
    }

    playTone(size, type) {
      if (!audioCtx || isMuted) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const now = audioCtx.currentTime;
      const cleanSize = Math.min(Math.abs(size), 4000);
      const scaleIndex = Math.floor((1 - (cleanSize / 4000)) * (SCALE.length - 1));
      const freq = SCALE[Math.max(0, Math.min(scaleIndex, SCALE.length - 1))];

      const gainNode = audioCtx.createGain();
      gainNode.connect(this.inputNode);

      if (type === 'add') {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq;
        
        const osc2 = audioCtx.createOscillator();
        osc2.type = 'sine';
        osc2.frequency.value = freq * 2;
        
        const gain2 = audioCtx.createGain();
        gain2.gain.value = 0.1;

        osc.connect(gainNode);
        osc2.connect(gain2);
        gain2.connect(gainNode);

        gainNode.gain.setValueAtTime(0, now);
        gainNode.gain.linearRampToValueAtTime(0.4, now + 0.02);
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + 2.0);

        osc.start(now);
        osc2.start(now);
        osc.stop(now + 2.0);
        osc2.stop(now + 2.0);

      } else if (type === 'sub') {
        const osc = audioCtx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.value = freq;

        gainNode.gain.setValueAtTime(0, now);
        gainNode.gain.linearRampToValueAtTime(0.25, now + 0.01);
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

        osc.connect(gainNode);
        osc.start(now);
        osc.stop(now + 0.6);

      } else if (type === 'newuser') {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = 220;
        
        const osc2 = audioCtx.createOscillator();
        osc2.type = 'sine';
        osc2.frequency.value = 221; 

        osc.connect(gainNode);
        osc2.connect(gainNode);

        gainNode.gain.setValueAtTime(0, now);
        gainNode.gain.linearRampToValueAtTime(0.3, now + 0.5);
        gainNode.gain.linearRampToValueAtTime(0, now + 2.0);

        osc.start(now);
        osc2.start(now);
        osc.stop(now + 2.0);
        osc2.stop(now + 2.0);
      }
    }
  }

  const audio = new AudioEngine();

  // --- Visual Engine ---
  class Particle {
    constructor(x, y, size, color, type) {
      this.x = x;
      this.y = y;
      this.targetRadius = Math.max(5, Math.log(Math.abs(size) + 1) * 4); 
      this.radius = 0;
      this.color = color;
      this.life = 1.0;
      this.decay = 0.005 + (Math.random() * 0.005);
      this.type = type;
    }

    update() {
      if (this.radius < this.targetRadius) {
        this.radius += 0.5;
      }
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = Math.max(0, this.life);
      ctx.fill();
      
      ctx.globalAlpha = 1;

      if (this.type === 'newuser') {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius + (1 - this.life) * 80, 0, Math.PI * 2);
        ctx.strokeStyle = this.color;
        ctx.globalAlpha = Math.max(0, this.life - 0.2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }

  function loop() {
    ctx.fillStyle = 'rgba(5, 5, 8, 0.2)'; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) {
        particles.splice(i, 1);
      }
    }
    requestAnimationFrame(loop);
  }

  // --- Data Stream Logic ---
  function startStream() {
    statusEl.textContent = "Connecting...";
    statusDot.className = "w-2.5 h-2.5 rounded-full bg-outline-variant animate-pulse";

    eventSource = new EventSource(CONFIG.streamUrl);

    eventSource.onopen = () => {
      statusEl.textContent = "Live Feed Listening";
      statusDot.className = "w-2.5 h-2.5 rounded-full bg-secondary animate-pulse";
    };

    eventSource.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'edit' || data.type === 'log') {
        handleEvent(data);
      }
    };
    
    eventSource.onerror = () => {
      statusEl.textContent = "Reconnecting...";
      statusDot.className = "w-2.5 h-2.5 rounded-full bg-error";
    }
  }

  function handleEvent(data) {
    if (data.user && /bot/i.test(data.user)) {
      return;
    }

    let sizeChange = 0;
    let type = 'neutral';
    let color = CONFIG.colors.neutral;

    if (data.type === 'log' && data.log_action === 'create') {
      type = 'newuser';
      color = CONFIG.colors.newuser;
      sizeChange = 1000;
    } else {
      sizeChange = (data.length && data.length.new && data.length.old) 
        ? data.length.new - data.length.old 
        : 0;

      if (sizeChange > 0) {
        type = 'add';
        color = CONFIG.colors.add;
      } else if (sizeChange < 0) {
        type = 'sub';
        color = CONFIG.colors.sub;
      }
    }

    if (Math.abs(sizeChange) < 15 && type !== 'newuser') return;

    const x = Math.random() * canvas.width;
    const y = Math.random() * canvas.height;
    particles.push(new Particle(x, y, sizeChange, color, type));
    if (particles.length > CONFIG.maxParticles) particles.shift();

    audio.playTone(sizeChange, type);
    addToFeed(data.title, sizeChange, type, data.user);
  }

  function addToFeed(title, size, type, user) {
    const item = document.createElement('div');
    item.className = `feed-item ${type} glass-panel border border-border-subtle/50 p-2 rounded text-body-sm shadow-sm flex flex-col gap-0.5 opacity-0 -translate-x-4 transition-all`;
    
    let borderCol = "border-l-4 border-l-[#3366CC]";
    if (type === 'add') borderCol = "border-l-4 border-l-[#22C55E]";
    else if (type === 'sub') borderCol = "border-l-4 border-l-[#EF4444]";
    else if (type === 'newuser') borderCol = "border-l-4 border-l-[#A78BFA]";
    
    item.className += ` ${borderCol}`;
    const sizeStr = size > 0 ? `+${size}` : `${size}`;
    
    item.innerHTML = `
      <span class="font-bold text-on-surface truncate block" title="${title}">${title}</span>
      <div class="flex justify-between text-[11px] text-text-secondary font-code mt-0.5">
        <span class="truncate max-w-[120px]">${user}</span>
        <span class="font-bold">${type === 'newuser' ? 'New User' : sizeStr}</span>
      </div>`;

    feedContainer.prepend(item); 
    if (feedContainer.children.length > CONFIG.maxFeedItems) {
      feedContainer.lastElementChild.remove();
    }
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  document.getElementById('start-btn').addEventListener('click', () => {
    document.getElementById('overlay').style.opacity = 0;
    setTimeout(() => document.getElementById('overlay').remove(), 500);
    
    audio.init();
    startStream();
    loop();
  });

  const muteBtn = document.getElementById('mute-btn');
  const volumeIcon = document.getElementById('volume-icon');
  
  muteBtn.addEventListener('click', () => {
    isMuted = !isMuted;
    muteBtn.innerHTML = isMuted 
      ? '<span class="material-symbols-outlined text-[18px]">volume_off</span> Unmute Audio'
      : '<span class="material-symbols-outlined text-[18px]">volume_up</span> Mute Audio';
  });
</script>
</body>
</html>
